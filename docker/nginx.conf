# HTTP — suffisant pour ouvrir l'app, mais navigator.share, le presse-papier
# et la camera (getUserMedia) sont indisponibles : les navigateurs ne
# considerent comme "contexte securise" que localhost et 127.0.0.1, jamais une
# IP privee. Utiliser l'ecouteur HTTPS ci-dessous pour ces fonctionnalites.
server {
    listen 80;
    server_name _;
    include /etc/nginx/app-common.conf;
}

# HTTPS avec certificat auto-signe, genere au demarrage par
# docker/30-selfsigned-cert.sh. Le navigateur affichera un avertissement :
# une fois l'exception acceptee, isSecureContext passe a true et partage,
# presse-papier et camera fonctionnent.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:2m;
    ssl_session_timeout 1h;

    include /etc/nginx/app-common.conf;
}
