server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Injecte env.js dans le <head> sans modifier src/index.html.
    sub_filter '</head>' '<script src="/env.js"></script></head>';
    sub_filter_once on;

    # ------------------------------------------------------------------
    # Proxy Appwrite — l'API est servie sur la même origine que l'app.
    #
    # Deux problèmes résolus d'un coup :
    #   1. Plus de CORS du tout (same-origin), donc plus besoin de déclarer
    #      chaque IP/hostname en "platform" dans Appwrite.
    #   2. Le routeur d'Appwrite 1.9 filtre par Host et n'accepte que la
    #      valeur unique de _APP_DOMAIN (127.0.0.1) — une liste séparée par
    #      des virgules casse le routage. On réécrit donc le Host ici plutôt
    #      que de toucher à la config du backend.
    #
    # ^~ est nécessaire : sans lui, la location regex des assets ci-dessous
    # capterait les URLs d'API se terminant par une extension de fichier.
    # ------------------------------------------------------------------

    # WebSocket du realtime — doit passer avant /v1/
    location ^~ /v1/realtime {
        proxy_pass http://appwrite-traefik:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Les connexions realtime sont longues
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /v1/ {
        proxy_pass http://appwrite-traefik:80;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }

    # Jamais mis en cache : contient la config runtime.
    location = /env.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Les bundles Angular sont hashés : cache long sans revalidation.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|ico|webp|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html jamais mis en cache, sinon un déploiement ne se voit pas.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Fallback SPA : sans ça, un refresh sur /room/xyz renvoie 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
