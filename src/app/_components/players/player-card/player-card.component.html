<div
  class="card"
  [ngClass]="{
    'player-card--active': isActive,
    'player-card--inactive': !isActive && hasActivePlayer
  }"
>
  <div class="card-body p-2 container">
    <div class="row mb-1">
      <label for="avatar" class="d-flex flex-wrap justify-content-around flex-fill align-items-center">
        <img alt="avatar" class="img-thumbnail" width="40" height="40" src="{{ player.avatarSrc }}" />
        <span class="ms-1 fs-5 flex-fill">{{ player.name }}</span>
        <span
          (click)="openPlayerGivenSipsModal(player)"
          class="badge"
          [ngClass]="{
            'bg-success': sipCount() > 0,
            'bg-danger': sipCount() < 0,
            'bg-secondary': sipCount() === 0,
          }"
          >{{ sipCountAbsolute() }} <fa-icon [icon]="['fas', 'wine-glass']"></fa-icon
        ></span>
      </label>
    </div>
    <div class="row">
      <div
        class="card-group d-flex flex-nowrap justify-content-center gap-1"
      >
        @for (i of cardSlots; track i) {
          <div>
            <app-playing-card [card]="player.cards[i]"></app-playing-card>
          </div>
        }
      </div>
      @if (lastTurnSips() > 0) {
        <div class="text-center mt-1">
          <span class="badge bg-warning text-dark per-turn-sips">
            +{{ lastTurnSips() }} <fa-icon [icon]="['fas', 'wine-glass']"></fa-icon>
          </span>
        </div>
      }
    </div>
  </div>
</div>

<app-player-given-sips-selection></app-player-given-sips-selection>
