@if (gameSrv.isGameStarted() || gameSrv.isGameFinished()) {
  <div class="container">
    <div class="row gap-1 justify-content-evenly">
      @for (player of gameSrv.players(); track player.id) {
        <div class="col-md-6 player p-0">
          <app-player-card [player]="player"></app-player-card>
        </div>
      }
    </div>
  </div>
}

@if (gameSrv.isSummaryMode()) {
  <app-game-summary></app-game-summary>
}
