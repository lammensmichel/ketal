@if (gameSrv.isGameStarted() || gameSrv.isGameFinished()) {
  <div class="container">
    <!-- Game Progress Indicator -->
    <app-game-progress></app-game-progress>

    <div class="players-grid">
      @for (player of gameSrv.players(); track player.id) {
        <app-player-card
          [player]="player"
          [isActive]="player.id === gameSrv.activePlayer()?.id"
          [hasActivePlayer]="!!gameSrv.activePlayer()"
        ></app-player-card>
      }
    </div>
  </div>
}

@if (gameSrv.isSummaryMode()) {
  <app-game-summary></app-game-summary>
}
