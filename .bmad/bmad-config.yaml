# BMAD Configuration for Ketal Project
# Adapted for Claude Code Sub-Agents

project:
  name: Ketal
  type: brownfield-fullstack
  description: French drinking card game (Grosse Guinze) with Angular 19 frontend and Node.js/Socket.IO backend

# Documentation paths
docs:
  prd:
    path: docs/prd.md
    shards_dir: docs/prd
  architecture:
    path: docs/architecture.md
    shards_dir: docs/architecture
  stories:
    path: docs/stories
    pattern: "{epic_num}.{story_num}.{title}.md"

# Agent configuration for Claude Code sub-agents
agents:
  analyst:
    subagent_type: Explore
    description: Analyzes codebase, gathers requirements, researches technical options
    tasks:
      - codebase-analysis
      - requirements-gathering
      - technical-research

  architect:
    subagent_type: Plan
    description: Designs system architecture, technical decisions, integration patterns
    tasks:
      - architecture-design
      - tech-stack-decisions
      - integration-planning

  pm:
    subagent_type: general-purpose
    description: Creates PRDs, manages epics, coordinates planning
    tasks:
      - prd-creation
      - epic-planning
      - stakeholder-coordination

  po:
    subagent_type: general-purpose
    description: Validates requirements, prioritizes features, acceptance criteria
    tasks:
      - requirements-validation
      - feature-prioritization
      - acceptance-criteria

  sm:
    subagent_type: general-purpose
    description: Creates detailed stories, manages sprint, facilitates development
    tasks:
      - story-creation
      - sprint-management
      - blocker-resolution

  dev:
    subagent_type: general-purpose
    description: Implements features, writes code, follows architecture guidelines
    tasks:
      - feature-implementation
      - code-writing
      - refactoring

  qa:
    subagent_type: general-purpose
    description: Reviews code, validates implementation, ensures quality
    tasks:
      - code-review
      - testing
      - quality-validation

# Development configuration
dev:
  always_load:
    - CLAUDE.md
    - docs/architecture.md
    - docs/prd.md
  debug_log: .bmad/debug-log.md
  command_prefix: bmad

# Workflow settings
workflow:
  default: brownfield-fullstack
  require_prd_approval: true
  require_architecture_approval: true
  story_size_target: "2-4 hour AI sessions"

# Quality gates
quality:
  checklists:
    - architect-checklist
    - story-draft-checklist
    - story-dod-checklist
    - change-checklist
